AWSTemplateFormatVersion: "2010-09-09"
Description: MLC support agent PoC. Ticket bucket, managed Knowledge Base, S3 data source, PII Guardrail.

Parameters:
  Prefix:
    Type: String
    Default: mlc-support-poc
    AllowedPattern: "^[a-z0-9-]{3,40}$"

Resources:
  TicketBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-tickets-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-kb-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Policies:
        - PolicyName: read-ticket-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt TicketBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${TicketBucket.Arn}/*"

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub "${Prefix}-tickets"
      Description: Escalated Lumis support tickets, one document per ticket, full and customer-only variants.
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: MANAGED
        ManagedKnowledgeBaseConfiguration:
          EmbeddingModelType: MANAGED

  TicketDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref KnowledgeBase
      Name: tickets
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: MANAGED_KNOWLEDGE_BASE_CONNECTOR
        ManagedKnowledgeBaseConnectorConfiguration:
          ConnectorParameters:
            type: S3
            version: "1"
            connectionConfiguration:
              bucketName: !Ref TicketBucket
              bucketOwnerAccountId: !Ref AWS::AccountId
            filterConfiguration:
              inclusionPrefixes:
                - tickets/

  IngestionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/bedrock/${Prefix}-kb-ingestion"
      RetentionInDays: 30

  IngestionLogSource:
    Type: AWS::Logs::DeliverySource
    Properties:
      Name: !Sub "${Prefix}-kb-ingestion"
      LogType: APPLICATION_LOGS
      ResourceArn: !GetAtt KnowledgeBase.KnowledgeBaseArn

  IngestionLogDestination:
    Type: AWS::Logs::DeliveryDestination
    Properties:
      Name: !Sub "${Prefix}-kb-ingestion"
      DestinationResourceArn: !GetAtt IngestionLogGroup.Arn
      OutputFormat: json

  IngestionLogDelivery:
    Type: AWS::Logs::Delivery
    Properties:
      DeliverySourceName: !Ref IngestionLogSource
      DeliveryDestinationArn: !GetAtt IngestionLogDestination.Arn

  PiiGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${Prefix}-pii"
      Description: >-
        Anonymise personal data, refuse questions that are not about My Learning
        Cloud, and score how well the draft is grounded in the past tickets.
      BlockedInputMessaging: >-
        I can only help with questions about My Learning Cloud. I am not able to
        answer this one.
      BlockedOutputsMessaging: The draft was withheld by the guardrail.
      TopicPolicyConfig:
        TopicsConfig:
          - Name: Off topic
            Type: DENY
            Definition: >-
              Requests that are not about the My Learning Cloud (MLC) platform:
              its courses, policies, reports, users, tenants, access or support.
              Everyday tasks, general knowledge, and other software products.
            Examples:
              - How do I change a flat tyre?
              - What is the capital of France?
              - Write me a poem about the sea.
            InputEnabled: true
            InputAction: BLOCK
            OutputEnabled: false
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: NAME
            Action: ANONYMIZE
          - Type: EMAIL
            Action: ANONYMIZE
          - Type: PHONE
            Action: ANONYMIZE
          - Type: ADDRESS
            Action: ANONYMIZE
          - Type: UK_NATIONAL_INSURANCE_NUMBER
            Action: ANONYMIZE
          - Type: PASSWORD
            Action: ANONYMIZE
      ContextualGroundingPolicyConfig:
        FiltersConfig:
          # Scores only: the app applies its own threshold from the trace.
          - Type: GROUNDING
            Threshold: 0.5
            Action: NONE
          - Type: RELEVANCE
            Threshold: 0.5
            Action: NONE

  EvaluationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-eval-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:evaluation-job/*"
      Policies:
        - PolicyName: eval-dataset-and-output
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt TicketBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "eval/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${TicketBucket.Arn}/eval/*"
              - Effect: Allow
                # R10: Claude 3.7 Sonnet, the judge model. See docs/evaluation.md.
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/anthropic.claude-3-7-sonnet-20250219-v1:0"

  PiiGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt PiiGuardrail.GuardrailId
      Description: v3 denied topic, grounding scores only

Outputs:
  BucketName:
    Value: !Ref TicketBucket
  KnowledgeBaseId:
    Value: !Ref KnowledgeBase
  DataSourceId:
    Value: !GetAtt TicketDataSource.DataSourceId
  IngestionLogGroup:
    Value: !Ref IngestionLogGroup
  GuardrailId:
    Value: !GetAtt PiiGuardrail.GuardrailId
  GuardrailVersion:
    Value: !GetAtt PiiGuardrailVersion.Version
  EvaluationRoleArn:
    Value: !GetAtt EvaluationRole.Arn
